services:
  - type: web
    name: renthub
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_FILE
        value: /var/data/app.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CURRENCY
        value: USD
      - key: PLATFORM_FEE_PERCENT
        value: "0"
      - key: APP_URL
        sync: false
      - key: APS_ENVIRONMENT
        value: sandbox
      - key: APS_SHA_TYPE
        value: sha256
      - key: APS_MERCHANT_IDENTIFIER
        sync: false
      - key: APS_ACCESS_CODE
        sync: false
      - key: APS_SHA_REQUEST_PHRASE
        sync: false
      - key: APS_SHA_RESPONSE_PHRASE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
